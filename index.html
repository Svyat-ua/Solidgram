<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solidgram</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon"><img src="img/solid.svg" alt=""></span>
        <h1>Solidgram</h1>
        <p>Мега жоский solidний чат </p>
      </div>
      <div class="auth-form">
        <input
          type="text"
          id="authNickInput"
          placeholder="Введи нікнейм..."
          maxlength="20"
          autocomplete="off"
        />
        <button id="authEnterBtn">Увійти в чат →</button>
      </div>
    </div>
  </div>
  <div class="app" id="app" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo2"><img src="img/solid.svg" alt=""></span>
        <span class="sidebar-title">Solidgram</span>
      </div>
      <div class="sidebar-section">
        <span class="section-label">🟢 Онлайн</span>
        <ul id="userList" class="user-list"></ul>
      </div>
      <p>Coming soon...</p>
      <div class="sidebar-bottom">
        <div class="my-nick-display">
          <span class="nick-avatar" id="myAvatar">?</span>
          <span id="myNickDisplay">—</span>
        </div>
      </div>
    </aside>
    <main class="chat-main">
      <header class="chat-header">
        <div class="header-info">
          <button class="hamburger-btn" id="hamburgerBtn" title="Меню">☰</button>
          <span class="header-icon"><img src="img/solid.svg" alt=""></span>
          <div>
            <div class="header-title">Загальний чат</div>
            <div class="header-sub" id="onlineCount">0 онлайн</div>
          </div>
        </div>
      </header>
      <div class="messages-wrap" id="messagesWrap">
        <ul class="messages-list" id="messages"></ul>
      </div>
      <div class="input-area">
        <form id="form">
          <button type="button" class="emoji-btn" id="emojiBtn">😄</button>
          <input id="input"autocomplete="off"placeholder="Написати повідомлення..."maxlength="500"/>
          <button type="submit" class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </form>
        <div class="emoji-picker" id="emojiPicker">
          <span>🥹</span><span>🤩</span><span>😈</span><span>💀</span>
          <span>🤡</span><span>👻</span><span>👽</span><span>🤖</span>
          <span>🐸</span><span>🦊</span><span>🐼</span><span>🦄</span>
          <span>🍕</span><span>🍔</span><span>🍟</span><span>🍩</span>
          <span>🚀</span><span>⚡</span><span>🌈</span><span>💎</span>
          <span>🫡</span><span>🫠</span><span>🤯</span><span>🥶</span>
          <span>😴</span><span>🤪</span><span>🙃</span><span>😏</span>
          <span>🦁</span><span>🐱</span><span>🐙</span><span>🦋</span>
          <span>🍉</span><span>🍓</span><span>🍒</span><span>🥑</span>
          <span>💸</span><span>🎮</span><span>👑</span>
          <span class="custom-emoji" data-emoji="🟢">
              <img src="img/solid.svg" alt="Solid">
          </span>
        </div>  
      </div>
    </main>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
